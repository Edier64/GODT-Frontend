# =============================================================================
# GODT Regional 3 — Nginx: sirve SPA de Vue y proxea /api al backend
# =============================================================================
server {
    listen 80;
    server_name _;

    # Raíz de archivos estáticos Vue
    root /usr/share/nginx/html;
    index index.html;

    # -------------------------------------------------------------------------
    # SPA fallback: todas las rutas que no sean archivos reales → index.html
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -------------------------------------------------------------------------
    # Proxy hacia el backend NestJS
    # Prefijo real del backend: /api/v1 (sin global prefix en main.ts)
    # Las rutas del frontend usan /api/v1/... → se pasan directamente.
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass         http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Límite de carga para documentos (Multer permite ~20 MB)
        client_max_body_size 25M;

        # Timeout ampliado para OCR multimodal (Gemini puede tardar)
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_connect_timeout 10s;
    }

    # -------------------------------------------------------------------------
    # Health check del backend accesible vía Nginx
    # -------------------------------------------------------------------------
    location /health {
        proxy_pass         http://backend:3000/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_read_timeout 10s;
    }

    # -------------------------------------------------------------------------
    # Preparación para HTTPS en Azure (bloque comentado)
    # Descomentear y agregar certificados al desplegar con Let's Encrypt
    # -------------------------------------------------------------------------
    # listen 443 ssl;
    # ssl_certificate     /etc/letsencrypt/live/<domain>/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/<domain>/privkey.pem;
    # ssl_protocols       TLSv1.2 TLSv1.3;
    # ssl_ciphers         HIGH:!aNULL:!MD5;
}

