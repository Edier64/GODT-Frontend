# =============================================================================
# GODT Regional 3 — Nginx Gateway (plantilla para Azure Container Apps y local)
# Variables sustituidas al arranque vía /etc/nginx/templates/default.conf.template:
#   - API_UPSTREAM    (ej. http://godt-api:3000 en local o https://<fqdn-interno> en ACA)
#   - API_HOST_HEADER (ej. $http_host en local o <fqdn-interno> en ACA)
# =============================================================================
server {
    listen 80;
    server_name _;
    resolver ${NGINX_LOCAL_RESOLVERS} valid=15s;

    root /usr/share/nginx/html;
    index index.html;

    # Cabeceras básicas de endurecimiento web (TLS terminado por Azure Container Apps)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Bloquear exposición de archivos ocultos o privados (.env, .git, etc.)
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Health check propio del gateway (liveness/readiness probe en ACA y Compose)
    location = /health {
        default_type text/plain;
        return 200 "ok\n";
        access_log off;
    }

    # Reverse proxy hacia godt-api conservando el prefijo exacto /api/v1/
    # Usar variable + resolver evita caché DNS estática cuando API reinicia o escala
    location /api/v1/ {
        set $api_upstream  "${API_UPSTREAM}";
        proxy_pass         $api_upstream;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;

        proxy_set_header   Host              ${API_HOST_HEADER};
        proxy_set_header   X-Forwarded-Host  $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Preservar cookies HttpOnly (godt_refresh_token con Path=/api/v1/auth)
        proxy_pass_header  Set-Cookie;

        # Límite de carga para historias clínicas y documentos (Multer permite hasta 20 MB)
        client_max_body_size 25M;

        # Timeouts ampliados para operaciones OCR y exportación documental
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout  10s;
    }

    # Fallback SPA de Vue Router (evita cachear index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
}
