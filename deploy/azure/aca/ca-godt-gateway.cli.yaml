identity:
  type: UserAssigned
  userAssignedIdentities:
    /subscriptions/bce68201-72d6-452a-8aa9-31b15d163096/resourceGroups/rg-godt-demo-ncus/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-godt-gateway: {}
properties:
  configuration:
    activeRevisionsMode: Single
    ingress:
      external: true
      allowInsecure: false
      targetPort: 80
      transport: auto
    registries:
      - server: acrgodtdemoncus01.azurecr.io
        identity: /subscriptions/bce68201-72d6-452a-8aa9-31b15d163096/resourceGroups/rg-godt-demo-ncus/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-godt-gateway
  template:
    containers:
      - name: gateway
        image: acrgodtdemoncus01.azurecr.io/godt-gateway:fa65246
        resources:
          cpu: 0.25
          memory: 0.5Gi
        env:
          - name: API_UPSTREAM
            value: https://ca-godt-api.internal.victoriousocean-dfb4e9e7.northcentralus.azurecontainerapps.io
          - name: API_HOST_HEADER
            value: ca-godt-api.internal.victoriousocean-dfb4e9e7.northcentralus.azurecontainerapps.io
          - name: NGINX_ENTRYPOINT_LOCAL_RESOLVERS
            value: "1"
          - name: NGINX_ENVSUBST_FILTER
            value: '^(API_UPSTREAM|API_HOST_HEADER|NGINX_LOCAL_RESOLVERS)$'
        probes:
          - type: Startup
            tcpSocket:
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          - type: Liveness
            tcpSocket:
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          - type: Readiness
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
    scale:
      minReplicas: 1
      maxReplicas: 2
